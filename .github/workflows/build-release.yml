name: Build and Release

# 推送到 main 後：跑單元測試 → 用固定的 debug 簽章金鑰建置 APK → 若 app/build.gradle.kts 的 versionName 還沒有對應的 Release，
# 就自動發佈 v<versionName>（附 APK 與 .sha256，App 內「檢查更新」讀的就是這個）。
# 發新版的做法：改 versionCode / versionName → 推送，其餘都由這個流程處理。
# 簽章金鑰存在 Secret GPSLOC_DEBUG_KEYSTORE_BASE64；沒有就退回隨機簽章並警告，且不會發佈（避免發出無法覆蓋安裝的 APK）。
on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'release-notes/**'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install required Android SDK components
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$SDK_ROOT" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain --stacktrace

      # 固定 debug 簽章：金鑰存在 Secret GPSLOC_DEBUG_KEYSTORE_BASE64（沒有就退回隨機簽章並警告）。
      - name: Prepare fixed debug signing key
        id: signing
        env:
          KS_B64: ${{ secrets.GPSLOC_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/gpsloc-debug.keystore"
            echo "GPSLOC_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/gpsloc-debug.keystore" >> "$GITHUB_ENV"
            echo "fixed=true" >> "$GITHUB_OUTPUT"
          else
            echo "fixed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GPSLOC_DEBUG_KEYSTORE_BASE64 is not set: the APK is signed with a random debug key and cannot update-install over earlier builds. No release will be published."
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Show APK signing certificate
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gps-locator-tw-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release for the current versionName
        if: steps.signing.outputs.fixed == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          TAG="v$VER"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            exit 0
          fi
          APK="gps-locator-tw-$VER-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          NOTES="release-notes/$TAG.md"
          if [ ! -f "$NOTES" ]; then
            printf '由雲端自動建置（commit %s）。簽章與先前版本相同，可直接覆蓋安裝；套件名稱 com.gpsupdater.app。SHA-256 見附檔 .sha256。\n' "${GITHUB_SHA::7}" > "$RUNNER_TEMP/notes.md"
            NOTES="$RUNNER_TEMP/notes.md"
          fi
          gh release create "$TAG" "$APK" "$APK.sha256" --target "$GITHUB_SHA" --latest \
            --title "GPS 定位器 繁體中文版 $VER（debug）" --notes-file "$NOTES"
